<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">并查集：union只挂根，find只压缩本次路径</title><desc id="desc">图中箭头是parent辅助指针，未必是原图中的边。</desc>
<rect width="1000" height="500" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<metadata id="trace">{&quot;before&quot;: {&quot;1&quot;: 1, &quot;3&quot;: 1, &quot;7&quot;: 3, &quot;5&quot;: 5, &quot;2&quot;: 5}, &quot;after_union&quot;: {&quot;1&quot;: 1, &quot;3&quot;: 1, &quot;7&quot;: 1, &quot;5&quot;: 1, &quot;2&quot;: 5}, &quot;after_find&quot;: {&quot;1&quot;: 1, &quot;3&quot;: 1, &quot;7&quot;: 1, &quot;5&quot;: 1, &quot;2&quot;: 1}}</metadata>
<text x="24" y="36" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">并查集：union只挂根，find只压缩本次路径</text>
<text x="24" y="85" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#172b4d">初始</text>
<rect x="24" y="99" width="950" height="48" rx="7" fill="#eff6ff" stroke="#8290a4"/>
<text x="36" y="129.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">7 → 3 → 1（根）     2 → 5（根）</text>
<text x="24" y="178" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#172b4d">union(7,2)先做两次find</text>
<rect x="24" y="192" width="950" height="48" rx="7" fill="#eff6ff" stroke="#8290a4"/>
<text x="36" y="222.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">7 → 1；3 → 1；2 → 5（根）</text>
<text x="24" y="271" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#172b4d">按大小合并，只挂根5</text>
<rect x="24" y="285" width="950" height="48" rx="7" fill="#eff6ff" stroke="#8290a4"/>
<text x="36" y="315.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">5 → 1；2仍 → 5；并非所有点都已压平</text>
<text x="24" y="364" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#172b4d">之后find(2)</text>
<rect x="24" y="378" width="950" height="48" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="408.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">沿2 → 5 → 1找到根，再把2直接改指1</text>
<text x="24" y="475" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">未经过的分支不自动改变；集合代表树不是连通路线，不能用它输出原图路径。</text>
</svg>
