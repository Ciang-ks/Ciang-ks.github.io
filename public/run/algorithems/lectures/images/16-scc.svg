<path d="M415,190 Q500,175 470,263" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M447,280 Q355,270 383,190" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="66" y="148" width="52" height="44" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="78" y="176.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">A</text>
