<text x="188" y="296.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">C</text>
<rect x="376" y="148" width="52" height="44" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="388" y="176.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">D</text>
