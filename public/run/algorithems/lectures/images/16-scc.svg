<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">缩点：ABC、DE、单点F是三个分量</title><desc id="desc">左图每条有向边有清晰箭头；右图仅保留分量之间的边。本图与两遍DFS例子的分组不同。</desc>
<rect width="1000" height="540" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">缩点：ABC、DE、单点F是三个分量</text>
