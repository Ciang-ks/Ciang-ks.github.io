<text x="24" y="477" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">右侧没有环；若一圈分量可互相到达，它们原本就该合为一个SCC。</text>
<text x="24" y="516" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">只保留分量间可达信息；要算内部路径或其他目标时，还须保存相应信息。</text>
</svg>
