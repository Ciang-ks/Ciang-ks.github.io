<text x="55" y="369" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">A→B→C→A；D与E双向可达</text>
<path d="M635,260 L690,260" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="625" y="232" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">缩点</text>
