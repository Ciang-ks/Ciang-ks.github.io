<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">归约方向：原图的独立集，就是补图的团</title><desc id="desc">三点路径A到B到C的补图只有A到C；保持顶点及k不变。</desc>
<rect width="1000" height="530" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">归约方向：原图的独立集，就是补图的团</text>
<text x="40" y="100" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#172b4d">原图G：路径A—B—C</text>
<path d="M115,195 L218,195" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M270,195 L374,195" stroke="#475569" stroke-width="2" fill="none"/>
<rect x="66" y="172" width="54" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="78" y="201.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">A</text>
<rect x="221" y="172" width="54" height="46" rx="7" fill="#f1f5f9" stroke="#8290a4"/>
<text x="233" y="201.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">B</text>
<rect x="376" y="172" width="54" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="388" y="201.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">C</text>
<text x="540" y="100" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#172b4d">补图：只有A—C，B孤立</text>
<path d="M610,178 Q745,40 880,178" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="566" y="172" width="54" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="578" y="201.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">A</text>
<rect x="721" y="172" width="54" height="46" rx="7" fill="#f1f5f9" stroke="#8290a4"/>
<text x="733" y="201.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">B</text>
<rect x="876" y="172" width="54" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="888" y="201.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">C</text>
<text x="24" y="290" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">选深蓝色A、C：原图没有A—C边，构成独立集；补图有A—C边，构成团。</text>
<rect x="24" y="326" width="950" height="54" rx="7" fill="#e0f2fe" stroke="#8290a4"/>
<text x="36" y="359.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">同一顶点集合、同一个k，YES与NO都保持；构造只检查全部顶点对。</text>
<rect x="24" y="406" width="950" height="54" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="439.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">G,k → 多项式构造补图 → 调用“团≥k”的求解器 → 原独立集问题答案</text>
<text x="24" y="507" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">A≤ₚB：会解B就会解A，因此B至少一样难；箭头不表示B比A容易。</text>
</svg>
