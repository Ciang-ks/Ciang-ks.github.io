<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><ns0:title id="title">斐波那契：调用依赖与实际计算，是两个相反方向</ns0:title><ns0:desc id="desc">按从上到下、从左到右顺序阅读。状态与正文同一示例，箭头的含义在图内标明。</ns0:desc><ns0:rect width="1000" height="510" fill="#fff" /><ns0:defs><ns0:marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" /></ns0:marker></ns0:defs>
<ns0:text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">斐波那契：调用依赖与实际计算，是两个相反方向</ns0:text>
<ns0:text x="24" y="80" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">实线箭头 A → B 表示“算 A 需要先算 B”；箭头不表示执行顺序。</ns0:text>
<ns0:path d="M480,185 L355,185" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)" />
<ns0:path d="M480,165 Q375,70 130,165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<ns0:path d="M655,185 L530,185" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)" />
<ns0:path d="M655,165 Q550,70 305,165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<ns0:path d="M830,185 L705,185" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)" />
<ns0:path d="M830,165 Q725,70 480,165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<ns0:rect x="55" y="165" width="130" height="64" rx="8" fill="#eef4ff" stroke="#64748b" />
<ns0:text x="69" y="204" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(0)</ns0:text>
<ns0:rect x="230" y="165" width="130" height="64" rx="8" fill="#eef4ff" stroke="#64748b" />
<ns0:text x="244" y="204" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(1)</ns0:text>
<ns0:rect x="405" y="165" width="130" height="64" rx="8" fill="#eef4ff" stroke="#64748b" />
<ns0:text x="419" y="204" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(2)</ns0:text>
<ns0:rect x="580" y="165" width="130" height="64" rx="8" fill="#eef4ff" stroke="#64748b" />
<ns0:text x="594" y="204" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(3)</ns0:text>
<ns0:rect x="755" y="165" width="130" height="64" rx="8" fill="#eef4ff" stroke="#64748b" />
<ns0:text x="769" y="204" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(4)</ns0:text>
<ns0:text x="24" y="260" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">先给基例：F(0)=0，F(1)=1。接着按 i 增大计算：</ns0:text>
<ns0:rect x="55" y="280" width="130" height="62" rx="8" fill="#e8f6ec" stroke="#64748b" />
<ns0:text x="69" y="318.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(0) = 0</ns0:text>
<ns0:path d="M188,311 L222,311" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)" />
<ns0:rect x="230" y="280" width="130" height="62" rx="8" fill="#e8f6ec" stroke="#64748b" />
<ns0:text x="244" y="318.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(1) = 1</ns0:text>
<ns0:path d="M363,311 L397,311" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)" />
<ns0:rect x="405" y="280" width="130" height="62" rx="8" fill="#e8f6ec" stroke="#64748b" />
<ns0:text x="419" y="318.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(2) = 1</ns0:text>
<ns0:path d="M538,311 L572,311" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)" />
<ns0:rect x="580" y="280" width="130" height="62" rx="8" fill="#e8f6ec" stroke="#64748b" />
<ns0:text x="594" y="318.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(3) = 2</ns0:text>
<ns0:path d="M713,311 L747,311" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)" />
<ns0:rect x="755" y="280" width="130" height="62" rx="8" fill="#e8f6ec" stroke="#64748b" />
<ns0:text x="769" y="318.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">F(4) = 3</ns0:text>
<ns0:text x="24" y="393" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">下排箭头表示计算先后：先满足依赖，再计算使用它的状态。</ns0:text>
<ns0:text x="24" y="435" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">共享状态只算一次；树也属于 DAG，不能单凭图形名称区分分治与 DP。</ns0:text></ns0:svg>