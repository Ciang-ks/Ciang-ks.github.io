<text x="24" y="416" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">横轴：追加次数。总代价=16次新写入+1+2+4+8次复制=31。</text>
<text x="24" y="455" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">任意n次追加总成本&lt;3n；某次柱高可超过3，摊销界不是单次最坏界。</text>
