<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Two Sum：[3,3]，target=6；seen 只存之前的位置</title><desc id="desc">按从上到下、从左到右顺序阅读。状态与正文同一示例，箭头的含义在图内标明。</desc><rect width="1000" height="400" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">Two Sum：[3,3]，target=6；seen 只存之前的位置</text>
<text x="24" y="82" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">每行先读“查询前”，再执行“查补数”；命中后直接返回。</text>
<rect x="24" y="110" width="290" height="62" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="38" y="148.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">i=0，x=3，need=3</text>
<rect x="350" y="110" width="170" height="62" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="364" y="148.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">{}</text>
<path d="M528,141 L572,141" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="590" y="110" width="380" height="62" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="604" y="148.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">未命中 → 写入 3:0</text>
<rect x="24" y="210" width="290" height="62" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="38" y="248.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">i=1，x=3，need=3</text>
<rect x="350" y="210" width="170" height="62" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="364" y="248.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">{3:0}</text>
<path d="M528,241 L572,241" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="590" y="210" width="380" height="62" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="604" y="248.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">命中 → 返回 [0,1]</text>
<text x="24" y="325" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">查询前的 seen 不含当前位置，因此不会把同一个元素配给自己。</text>
<text x="24" y="365" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a12622">试错：若先写 3:0 再查，第一行就可能错误得到 [0,0]。</text></svg>