<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">位技巧：先固定 8 位，看清借位和补码</title><desc id="desc">按从上到下、从左到右顺序阅读。状态与正文同一示例，箭头的含义在图内标明。</desc><rect width="1000" height="450" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">位技巧：先固定 8 位，看清借位和补码</text>
<text x="24" y="82" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">位从右向左编号；x=12。每行按相同位对齐，最低的 1 在第 2 位。</text>
<rect x="24" y="113" width="450" height="230" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="38" y="235.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d"></text>
<rect x="508" y="113" width="465" height="230" rx="8" fill="#f2edff" stroke="#64748b"/>
<text x="522" y="235.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d"></text>
<text x="44" y="150" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#172b4d">清除最低的 1</text>
<text x="528" y="150" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#172b4d">只保留最低的 1</text>
<text x="44" y="196" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">x</text>
<text x="280" y="196" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#172b4d">00001100</text>
<text x="44" y="241" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">x−1</text>
<text x="280" y="241" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#172b4d">00001011</text>
<text x="44" y="304" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">x &amp; (x−1)</text>
<text x="280" y="304" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#172b4d">00001000</text>
<text x="528" y="196" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">x</text>
<text x="770" y="196" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#172b4d">00001100</text>
<text x="528" y="241" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">−x（8位）</text>
<text x="770" y="241" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#172b4d">11110100</text>
<text x="528" y="304" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">x &amp; (−x)</text>
<text x="770" y="304" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#172b4d">00000100</text>
<text x="24" y="390" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">−12 的 8 位补码：00001100 逐位取反得 11110011，再加 1 得 11110100。</text>
<text x="24" y="432" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">Python 的负整数按符号扩展参与位运算；这里的 8 位仅用于展示低位。</text></svg>