<text x="645" y="225" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">字符下标用i−1、j−1</text>
<text x="645" y="283" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">格子下标用前缀长度i、j</text>
<text x="645" y="341" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">深蓝：两个末字符相等</text>
<text x="645" y="399" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">右下角：dp[5][3]=3</text>
<text x="24" y="535" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">回溯：e取入 → d跳过 → c取入 → b跳过 → a取入；倒转得到ace。</text>
<text x="24" y="581" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">行列各多留一个空前缀；先读左上/上/左的旧答案，再填当前格。</text>
