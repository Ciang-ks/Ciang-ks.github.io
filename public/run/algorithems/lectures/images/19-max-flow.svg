<text x="54" y="306.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">s</text>
<rect x="242" y="178" width="48" height="44" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="254" y="206.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
<rect x="242" y="378" width="48" height="44" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="254" y="406.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">b</text>
<rect x="432" y="278" width="48" height="44" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="444" y="306.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">t</text>
<path d="M587.360679774998,288.819660112501 L738.1671842700025,213.41640786499875" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="640.0" y="241.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">1/1</text>
