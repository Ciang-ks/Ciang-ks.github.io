<text x="754" y="406.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">b</text>
<rect x="932" y="278" width="48" height="44" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="944" y="306.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">t</text>
<path d="M310,380 Q360,300 310,220" fill="none" stroke="#b3261e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="325" y="316" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#b3261e">撤回1</text>
<text x="24" y="489" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">左图a→b流量1，故存在反向残量b→a容量1。</text>
<text x="24" y="534" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">第二次沿b→a撤销这1单位；右图a→b变0，s→a→t与s→b→t各送1。</text>
<text x="24" y="579" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">边上“流量/容量”不是两条边；每一步源汇外都满足流入=流出。</text>
<text x="24" y="624" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">s的两条出边容量总共2，流值达到2，所以这里已是最大流。</text>
</svg>
