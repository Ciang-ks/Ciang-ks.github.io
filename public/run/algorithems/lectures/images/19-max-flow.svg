<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">残量反向边：撤回a→b，再把流改道</title><desc id="desc">两图边上标流量/容量，红色虚线b到a是撤回旧流的残量边，不是原图边。</desc>
<rect width="1000" height="660" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">残量反向边：撤回a→b，再把流改道</text>
<text x="24" y="82" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">所有原边容量1；这是手动指定的两次增广，不声称BFS必先选坏路线。</text>
<text x="24" y="127" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#172b4d">① 先送s→a→b→t，总流1</text>
<text x="525" y="127" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#172b4d">② 再走s→b→a→t，总流2</text>
<path d="M87.36067977499789,288.819660112501 L238.16718427000254,213.41640786499875" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="140.0" y="241.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">1/1</text>
