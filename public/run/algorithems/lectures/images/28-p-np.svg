<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">P 与 NP：已知包含关系，不预设 P≠NP</title><desc id="desc">按从上到下、从左到右顺序阅读。状态与正文同一示例，箭头的含义在图内标明。</desc><rect width="1000" height="450" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">P 与 NP：已知包含关系，不预设 P≠NP</text>
<rect x="24" y="82" width="950" height="310" rx="8" fill="#f8fafc" stroke="#64748b"/>
<text x="38" y="244.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d"></text>
<text x="45" y="116" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">R：存在总能停止的判定算法</text>
<rect x="75" y="138" width="845" height="225" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="89" y="257.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d"></text>
<text x="95" y="172" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">EXP：指数时间可判定</text>
<rect x="125" y="192" width="740" height="140" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="139" y="269.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d"></text>
<text x="145" y="225" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">NP：YES 有多项式长度证书，可多项式验证</text>
<text x="145" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">P ⊆ NP：能求解，当然也能验证。是否相等？未知。</text>
<text x="145" y="307" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">NP完全问题：属于NP，且所有NP问题都能多项式归约到它。</text>
<text x="24" y="432" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">画出的NP区域允许P=NP；不把“只能验证、不能求解”当作NP的定义。</text></svg>