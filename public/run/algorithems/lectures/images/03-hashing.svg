<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">哈希冲突：同一组键，分别使用链与线性探测</title><desc id="desc">按从上到下、从左到右顺序阅读。状态与正文同一示例，箭头的含义在图内标明。</desc><rect width="1000" height="450" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">哈希冲突：同一组键，分别使用链与线性探测</text>
<text x="24" y="82" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">表长 m=5，h(k)=k mod 5；依次插入 5、10、12、17。</text>
<text x="24" y="128" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">链式：碰撞的键存同槽链中。开放寻址：槽被占用，就继续探测下一个槽。</text>
<text x="24" y="174" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">槽 0</text>
<rect x="24" y="190" width="170" height="60" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="38" y="227.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">5 → 10</text>
<rect x="24" y="295" width="170" height="60" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="38" y="332.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">5</text>
<text x="218" y="174" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">槽 1</text>
<rect x="218" y="190" width="170" height="60" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="232" y="227.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">空</text>
<rect x="218" y="295" width="170" height="60" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="232" y="332.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">10</text>
<text x="412" y="174" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">槽 2</text>
<rect x="412" y="190" width="170" height="60" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="426" y="227.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">12 → 17</text>
<rect x="412" y="295" width="170" height="60" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="426" y="332.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">12</text>
<text x="606" y="174" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">槽 3</text>
<rect x="606" y="190" width="170" height="60" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="620" y="227.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">空</text>
<rect x="606" y="295" width="170" height="60" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="620" y="332.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">17</text>
<text x="800" y="174" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">槽 4</text>
<rect x="800" y="190" width="170" height="60" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="814" y="227.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">空</text>
<rect x="800" y="295" width="170" height="60" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="814" y="332.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">空</text>
<text x="24" y="280" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">下排为开放寻址的最终状态：</text>
<text x="24" y="402" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">10 先试槽0，再放槽1；17 先试槽2，再放槽3。两种方式都需比较原键。</text>
<text x="24" y="438" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">线性探测查找必须沿同一探测顺序；删除不能直接制造“从未占用”的空槽。</text></svg>