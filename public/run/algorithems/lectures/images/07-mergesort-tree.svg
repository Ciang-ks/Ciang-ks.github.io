<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">归并排序：同一组输入的拆分与合并</title><desc id="desc">各组用竖线分隔，不把一个分组边界误当成数组元素。</desc>
<rect width="1000" height="500" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">归并排序：同一组输入的拆分与合并</text>
<rect x="24" y="82" width="950" height="45" rx="7" fill="#e7efff" stroke="#8290a4"/>
<text x="36" y="110.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">原输入：[5,2,4,6,1,3,2,6]</text>
<rect x="24" y="138" width="950" height="45" rx="7" fill="#e7efff" stroke="#8290a4"/>
<text x="36" y="166.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">分成两半：[5,2,4,6] | [1,3,2,6]</text>
<rect x="24" y="194" width="950" height="45" rx="7" fill="#e7efff" stroke="#8290a4"/>
<text x="36" y="222.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">继续拆：[5,2] | [4,6] | [1,3] | [2,6]</text>
<rect x="24" y="250" width="950" height="45" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="36" y="278.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">先合小组：[2,5] | [4,6] | [1,3] | [2,6]</text>
<rect x="24" y="306" width="950" height="45" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="36" y="334.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">再合两半：[2,4,5,6] | [1,2,3,6]</text>
<rect x="24" y="362" width="950" height="45" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="36" y="390.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">最终：[1,2,2,3,4,5,6,6]</text>
<text x="24" y="458" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#172b4d">两个有序段各留一个指针，每次取更小头部；相等时先取左边，保留原身份顺序。</text>
</svg>
