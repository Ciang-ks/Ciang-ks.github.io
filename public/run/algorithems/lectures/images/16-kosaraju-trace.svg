<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Kosaraju：完成较晚的源分量，反转边后走不出去</title><desc id="desc">按从上到下、从左到右顺序阅读。状态与正文同一示例，箭头的含义在图内标明。</desc><rect width="1000" height="560" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">Kosaraju：完成较晚的源分量，反转边后走不出去</text>
<text x="24" y="82" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">原图：A→B→C→A，C→D，D→E→F→D；邻接顺序与正文一致。</text>
<rect x="40" y="112" width="330" height="88" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="54" y="163.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">S = {A,B,C}，源分量</text>
<path d="M380,156 L610,156" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<text x="435" y="138" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">C → D</text>
<rect x="625" y="112" width="330" height="88" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="639" y="163.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">T = {D,E,F}，汇分量</text>
<text x="40" y="244" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">① 从 A 做 DFS：先深入到 F，再返回；C 必须等 D 的调用完成。</text>
<rect x="40" y="268" width="915" height="60" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="54" y="305.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">完成次序（数字是先后）：F=1，E=2，D=3，C=4，B=5，A=6</text>
<text x="40" y="365" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">② 反转全部边，再按 A、B、C、D、E、F 的顺序选择未分组起点。</text>
<rect x="40" y="392" width="330" height="70" rx="8" fill="#eef4ff" stroke="#64748b"/>
<text x="54" y="434.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">A → C → B，仅摘下 S</text>
<path d="M610,427 L380,427" stroke="#334155" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<text x="435" y="410" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">D → C</text>
<rect x="625" y="392" width="330" height="70" rx="8" fill="#e8f6ec" stroke="#64748b"/>
<text x="639" y="434.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">下一个新起点 D，摘下 T</text>
<text x="40" y="515" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">分量间反向边指入 S，所以从 S 内出发不能访问 T。</text></svg>