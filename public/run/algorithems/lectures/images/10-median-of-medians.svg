<text x="24" y="468" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#172b4d">蓝色九格 ≤ x；浅蓝色九格 ≥ x；高亮 x=16 同时属于两侧。</text>
<text x="24" y="506" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">一般淘汰约3n/10，取整需扣常数；不是每轮恰好保留一半。</text>
<text x="24" y="548" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#172b4d">T(n) ≤ T(⌈n/5⌉) + T(7n/10+O(1)) + O(n)</text>
<text x="24" y="581" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">第一项：递归选择组中位数的中位数；第二项：只搜索答案所在一侧。</text></svg>