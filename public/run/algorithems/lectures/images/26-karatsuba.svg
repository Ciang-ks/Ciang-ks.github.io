<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Karatsuba：12×34只做三次小乘法</title><desc id="desc">与正文同一个可手算的例子，演示拆位和交叉和。</desc>
<rect width="1000" height="440" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">Karatsuba：12×34只做三次小乘法</text>
<rect x="24" y="85" width="950" height="45" rx="7" fill="#e7efff" stroke="#8290a4"/>
<text x="36" y="113.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">12=1×10+2；34=3×10+4</text>
<rect x="24" y="142" width="950" height="45" rx="7" fill="#e7efff" stroke="#8290a4"/>
<text x="36" y="170.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">高位乘积=1×3=3；低位乘积=2×4=8</text>
<rect x="24" y="199" width="950" height="45" rx="7" fill="#e7efff" stroke="#8290a4"/>
<text x="36" y="227.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">两半和的乘积=(1+2)×(3+4)=21</text>
<rect x="24" y="256" width="950" height="45" rx="7" fill="#e7efff" stroke="#8290a4"/>
<text x="36" y="284.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">交叉和=21−3−8=10（即1×4+2×3）</text>
<rect x="24" y="313" width="950" height="45" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="36" y="341.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">拼回：3×100+10×10+8=408</text>
<text x="24" y="411" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#172b4d">每层三次半规模乘法，加减与拼接为线性工作，得到T(n)=3T(n/2)+O(n)。</text>
</svg>
