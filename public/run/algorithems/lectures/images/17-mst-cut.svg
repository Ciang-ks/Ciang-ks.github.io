<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">同一四点图：割的最轻边，与Kruskal按边选择</title><desc id="desc">边AB5 AC4 BD2 CD3 BC6，最小生成树总权9。</desc>
<rect width="1000" height="470" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">同一四点图：割的最轻边，与Kruskal按边选择</text>
<rect x="24" y="85" width="950" height="58" rx="7" fill="#eff6ff" stroke="#8290a4"/>
<text x="36" y="120.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">边：A—B(5)、A—C(4)、B—D(2)、C—D(3)、B—C(6)</text>
<rect x="24" y="168" width="950" height="58" rx="7" fill="#e0f2fe" stroke="#8290a4"/>
<text x="36" y="203.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">割S={A}，其余{B,C,D}；跨割只有AB(5)、AC(4)，最轻AC(4)。</text>
<rect x="24" y="253" width="950" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="282.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">① BD(2)：两端未连通，加入；总重2</text>
<rect x="24" y="310" width="950" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="339.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">② CD(3)：接入C，加入；总重5</text>
<rect x="24" y="367" width="950" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="396.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">③ AC(4)：接入A，加入；总重9；已满n−1=3条，停止</text>
<text x="24" y="455" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#172b4d">若为验证继续看AB(5)、BC(6)，它们会成环而跳过；这不是代码停止后的实际执行。</text>
</svg>
