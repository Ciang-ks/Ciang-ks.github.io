<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img">
<rect x="0.5" y="0.5" width="799.0" height="429.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="18.0" y="26.0" font-size="14.0" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">同一棵树，四种访问顺序</text><line x1="240.0" y1="104.0" x2="160.0" y2="190.0" stroke="#6b7280" stroke-width="1.6"/><line x1="240.0" y1="104.0" x2="320.0" y2="190.0" stroke="#6b7280" stroke-width="1.6"/><line x1="160.0" y1="190.0" x2="100.0" y2="276.0" stroke="#6b7280" stroke-width="1.6"/><line x1="160.0" y1="190.0" x2="190.0" y2="276.0" stroke="#6b7280" stroke-width="1.6"/><line x1="320.0" y1="190.0" x2="360.0" y2="276.0" stroke="#6b7280" stroke-width="1.6"/><circle cx="240.0" cy="104.0" r="19.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="240.0" y="108.5" font-size="13.0" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">1</text><circle cx="160.0" cy="190.0" r="19.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="160.0" y="194.6" font-size="13.0" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">2</text><circle cx="320.0" cy="190.0" r="19.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="320.0" y="194.6" font-size="13.0" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">3</text><circle cx="100.0" cy="276.0" r="19.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="100.0" y="280.6" font-size="13.0" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">4</text><circle cx="190.0" cy="276.0" r="19.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="190.0" y="280.6" font-size="13.0" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">5</text><circle cx="360.0" cy="276.0" r="19.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="360.0" y="280.6" font-size="13.0" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">6</text><text x="56.0" y="326.0" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">前序（根→左→右）</text><text x="240.0" y="326.0" font-size="14.0" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">1  2  4  5  3  6</text><text x="56.0" y="350.0" font-size="12.5" fill="#15803d" text-anchor="start" font-weight="bold" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">中序（左→根→右）</text><text x="240.0" y="350.0" font-size="14.0" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">4  2  5  1  3  6</text><text x="56.0" y="374.0" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">后序（左→右→根）</text><text x="240.0" y="374.0" font-size="14.0" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">4  5  2  6  3  1</text><text x="56.0" y="398.0" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="bold" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">层序（BFS）</text><text x="240.0" y="398.0" font-size="14.0" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">1  2  3  4  5  6</text><text x="470.0" y="330.0" font-size="12.0" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">DFS 用栈（或递归）</text><text x="470.0" y="352.0" font-size="12.0" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">BFS 用队列</text><text x="470.0" y="386.0" font-size="12.0" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">三种 DFS 序的差别，只在</text><text x="470.0" y="406.0" font-size="12.0" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">「什么时候记录当前节点」。</text>
</svg>
