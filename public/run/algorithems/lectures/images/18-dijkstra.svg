<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Dijkstra：有效弹出与过期记录分开看</title><desc id="desc">有向边s到a4、s到b1、b到a2、a到t5、b到t8。</desc>
<rect width="1000" height="590" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">Dijkstra：有效弹出与过期记录分开看</text>
<text x="24" y="82" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">有向边：s→a(4)，s→b(1)，b→a(2)，a→t(5)，b→t(8)。</text>
<rect x="24" y="110" width="950" height="51" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="141.5" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">弹出(0,s)：dist[a]=4，dist[b]=1</text>
<rect x="24" y="175" width="950" height="51" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="206.5" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">弹出(1,b)：dist[a]改为3，dist[t]=9</text>
<rect x="24" y="240" width="950" height="51" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="271.5" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">弹出(3,a)：dist[t]改为8</text>
<rect x="24" y="305" width="950" height="51" rx="7" fill="#f1f5f9" stroke="#8290a4"/>
<text x="36" y="336.5" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">弹出(4,a)：旧记录：4&gt;dist[a]=3，跳过</text>
<rect x="24" y="370" width="950" height="51" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="401.5" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">弹出(8,t)：有效记录：最短距离8</text>
<rect x="24" y="435" width="950" height="51" rx="7" fill="#f1f5f9" stroke="#8290a4"/>
<text x="36" y="466.5" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">弹出(9,t)：旧记录：9&gt;dist[t]=8，跳过</text>
<text x="24" y="548" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">dist保存当前最好值；堆还保存旧候选，不会在更新dist时自动删除旧项。</text>
</svg>
