<text x="172" y="117.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">b</text>
<rect x="228" y="90" width="62" height="42" rx="7" fill="#f1f3f6" stroke="#8290a4"/>
<text x="240" y="117.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
<text x="350" y="115" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">r=0，l=0：加入a</text>
<rect x="24" y="183" width="62" height="42" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="36" y="210.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
<rect x="92" y="183" width="62" height="42" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="104" y="210.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">b</text>
<rect x="160" y="183" width="62" height="42" rx="7" fill="#f1f3f6" stroke="#8290a4"/>
<text x="172" y="210.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">b</text>
