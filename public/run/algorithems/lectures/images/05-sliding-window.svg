<text x="172" y="396.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">b</text>
<rect x="228" y="369" width="62" height="42" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="240" y="396.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
<text x="350" y="394" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">r=3，l=2：加入a，不必回退l</text>
<text x="24" y="483" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">每轮开始集合对应s[l:r]；加入当前字符后才对应闭区间[l,r]。最大长度2。</text>
</svg>
