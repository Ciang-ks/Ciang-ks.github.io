<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">最长无重复子串：abba，先移除旧字符再加入新字符</title><desc id="desc">绿色区间为本轮修复后的合法窗口；r=2必须移除a和旧b。</desc>
<rect width="1000" height="510" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">最长无重复子串：abba，先移除旧字符再加入新字符</text>
<rect x="24" y="90" width="62" height="42" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="36" y="117.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
