<text x="240" y="210.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
<text x="350" y="208" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">r=1，l=0：加入b</text>
<rect x="24" y="276" width="62" height="42" rx="7" fill="#f1f3f6" stroke="#8290a4"/>
<text x="36" y="303.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
<rect x="92" y="276" width="62" height="42" rx="7" fill="#f1f3f6" stroke="#8290a4"/>
<text x="104" y="303.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">b</text>
<rect x="160" y="276" width="62" height="42" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="172" y="303.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">b</text>
<rect x="228" y="276" width="62" height="42" rx="7" fill="#f1f3f6" stroke="#8290a4"/>
<text x="240" y="303.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
<text x="350" y="301" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">r=2，l=2：想加b：先删a，再删旧b，最后加入新b</text>
