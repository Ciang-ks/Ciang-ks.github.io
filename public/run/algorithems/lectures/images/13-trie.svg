<text x="622" y="346.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">bat</text>
<text x="24" y="425" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">框中的字符串表示从根走到此处的整个前缀；边只消耗一个字符。</text>
<text x="24" y="472" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">查ap只走a→p；查app还要走一个p，并检查绿色词尾标记。</text>
