<text x="770.0" y="185.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">y</text>
<path d="M262,340 L412,340" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="337.5" y="328.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">a</text>
<path d="M467,340 L617,340" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="542.5" y="328.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">t</text>
<rect x="45" y="213" width="74" height="44" rx="7" fill="#e7efff" stroke="#8290a4"/>
