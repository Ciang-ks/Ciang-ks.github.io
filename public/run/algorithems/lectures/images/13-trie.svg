<text x="460.0" y="148.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">p</text>
<path d="M562,160 L657,160" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="610.0" y="148.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">l</text>
<path d="M712,160 L827,95" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="770.0" y="115.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">e</text>
