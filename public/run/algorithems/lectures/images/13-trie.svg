<rect x="350" y="138" width="74" height="44" rx="7" fill="#e7efff" stroke="#8290a4"/>
<text x="362" y="166.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">ap</text>
<rect x="500" y="138" width="74" height="44" rx="7" fill="#e7f5eb" stroke="#8290a4"/>
<text x="512" y="166.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">app</text>
