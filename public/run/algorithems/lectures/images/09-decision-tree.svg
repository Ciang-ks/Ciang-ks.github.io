<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">比较排序下界：三元素例子要分清六种次序</title><desc id="desc">给出三次比较内区分六种排列的分支，不画虚假空叶。</desc>
<rect width="1000" height="460" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569"/></marker></defs>
<text x="24" y="36" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#172b4d">比较排序下界：三元素例子要分清六种次序</text>
<rect x="24" y="85" width="950" height="46" rx="7" fill="#eff6ff" stroke="#8290a4"/>
<text x="36" y="114.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">先比较a&lt;b：真 → 比较b&lt;c；假 → 比较a&lt;c</text>
<rect x="24" y="143" width="950" height="46" rx="7" fill="#eff6ff" stroke="#8290a4"/>
<text x="36" y="172.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">若a&lt;b 且 b&lt;c：a&lt;b&lt;c；若a&lt;b但b≥c：再比较a&lt;c</text>
<rect x="24" y="201" width="950" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="230.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">  a&lt;c时：a&lt;c&lt;b；否则：c&lt;a&lt;b</text>
<rect x="24" y="259" width="950" height="46" rx="7" fill="#eff6ff" stroke="#8290a4"/>
<text x="36" y="288.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">若a≥b 且 a&lt;c：b&lt;a&lt;c；若a≥b且a≥c：再比较b&lt;c</text>
<rect x="24" y="317" width="950" height="46" rx="7" fill="#dbeafe" stroke="#8290a4"/>
<text x="36" y="346.0" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">  b&lt;c时：b&lt;c&lt;a；否则：c&lt;b&lt;a</text>
<text x="24" y="419" xml:space="preserve" style="white-space:pre" font-family="system-ui,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172b4d">假设元素互异。6个可能次序需至少6个叶，最大深度至少⌈log₂6⌉=3。</text>
</svg>
