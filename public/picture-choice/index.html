<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片比较任务</title>
<style>
  :root { color-scheme: light; font-family: "Noto Sans CJK SC","Microsoft YaHei",sans-serif; color: #111; background: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  #screen { position: fixed; inset: 0; overflow: auto; display: grid; place-items: center; padding: 24px; background: #fff; }
  .panel { width: min(100%, 650px); line-height: 1.65; }
  h1 { font-size: 1.65rem; line-height: 1.3; margin: 0 0 20px; }
  p { margin: 0 0 14px; }
  fieldset { border: 0; margin: 16px 0 0; padding: 0; }
  input[type=text], textarea { display: block; width: 100%; margin: 5px 0 12px; border: 1px solid #777; border-radius: 4px; padding: 8px; font: inherit; }
  textarea { min-height: 115px; }
  button { cursor: pointer; font: inherit; background: #1d262d; color: #fff; border: 1px solid #1d262d; border-radius: 5px; padding: 8px 15px; margin: 5px 8px 5px 0; }
  button.secondary { color: #1d262d; background: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid #2f6093; outline-offset: 3px; }
  .muted { color: #4b5054; font-size: .92rem; }
  .stage { position: fixed; inset: 0; background: #fff; user-select: none; }
  .center, .stim, .attention { position: absolute; transform: translate(-50%, -50%); }
  .center { left: 50%; top: 50%; }
  .cross { width: 20px; height: 20px; background: #000; clip-path: polygon(40% 0,60% 0,60% 40%,100% 40%,100% 60%,60% 60%,60% 100%,40% 100%,40% 60%,0 60%,0 40%,40% 40%); }
  .stim { width: min(200px, 25vw, 55vh); height: min(200px, 25vw, 55vh); top: 50%; object-fit: contain; }
  #left { left: calc(50% - min(250px, 29vw)); }
  #right { left: calc(50% + min(250px, 29vw)); }
  .feedback, .attention { font-size: clamp(20px, 5vh, 54px); line-height: 1.2; text-align: center; white-space: nowrap; }
  #check-hint { position: absolute; top: 10%; width: 100%; padding: 0 16px; text-align: center; font-size: clamp(15px, 4vh, 36px); }
  #up { left: 50%; top: 25%; } #down { left: 50%; top: 75%; }
  #east { left: calc(50% + min(30vh, 35vw)); top: 50%; }
  #west { left: calc(50% - min(30vh, 35vw)); top: 50%; }
  kbd { display: inline-block; min-width: 1.7em; padding: 0 .3em; border: 1px solid #71777b; border-radius: 4px; font: inherit; text-align: center; }
  .example-heading, .example-controls { position: absolute; left: 0; width: 100%; padding: 0 16px; text-align: center; }
  .example-heading { top: 3%; }
  .example-heading h1 { margin: 0; font-size: clamp(15px, 2.6vh, 24px); }
  .example-heading p { margin: 8px 0 0; }
  .example-controls { bottom: 3%; }
  .example-controls p { margin-bottom: 6px; }
</style>
</head>
<body>
<main id="screen"><section id="panel" class="panel" aria-live="polite"></section></main>
<div class="stage" id="stage" hidden>
  <div id="cross" class="center cross" aria-hidden="true" hidden></div>
  <img id="left" class="stim" alt="左侧图片" draggable="false" hidden>
  <img id="right" class="stim" alt="右侧图片" draggable="false" hidden>
  <div id="feedback" class="center feedback" hidden></div>
  <header id="example-heading" class="example-heading" hidden>
    <h1 id="example-title"></h1>
    <p id="example-instruction" hidden></p>
  </header>
  <div id="example-controls" class="example-controls" hidden>
    <p id="example-message" role="status" hidden></p>
    <div id="example-actions"></div>
  </div>
  <div id="attention" hidden>
    <div id="check-hint">按与中央数字对应的中文数字所在方向的键。</div>
    <div class="attention" id="up"></div><div class="attention" id="east"></div>
    <div class="attention" id="down"></div><div class="attention" id="west"></div>
    <div class="center feedback" id="target"></div>
  </div>
</div>

function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function createDesign() {
  let selected;
  do {
    selected = ["A", "B"].flatMap(group => shuffle(STIMULI.filter(item => item.group === group)).slice(0, 4));
  } while (selected.filter(item => item.macro === 1).length !== 4);
  const mainRanks = shuffle(selected).map(item => item.id);
  const orderedPairs = [];
  for (let high = 2; high <= 8; high++) {
    for (let low = 1; low < high; low++) {
      orderedPairs.push([high, low], [low, high]);
      if (high - low === 1) orderedPairs.push([high, low], [low, high]);
    }
  }
  return {
    mainRanks,
    practiceRanks: PRACTICE_RANKS,
    practice: PRACTICE,
    main: Array.from({length: 6}, () => shuffle(orderedPairs)),
    practiceChecks: [shuffle(CHECKS.slice(0,4)), shuffle(CHECKS.slice(0,4))],
    mainChecks: shuffle(CHECKS),
    bonusTrials: shuffle(Array.from({length: 420}, (_, i) => i + 1)).slice(0, 10)
  };
}

function makeRun(code) {

}

function uploadSnapshot() {
  if (!collection) return Promise.resolve(false);
  const snapshot = JSON.stringify(run);
  const revision = run.rows.length * 2 + Number(run.status !== "in_progress");
  const sessionId = run.session_id;
  const request = upload.then(async () => {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const response = await fetch(ENDPOINT, {
          method: "POST", headers: {"Content-Type": "application/json"}, body: snapshot,
          signal: AbortSignal.timeout(6000)
        });
        if (response.ok && (await response.json()).stored === true) {
          if (run?.session_id === sessionId) lastUploaded = Math.max(lastUploaded, revision);
          return true;
        }
      } catch {}
      if (attempt === 0) await sleep(750);
    }
    return false;
  });
  upload = request.catch(() => false);
  return upload;
}

document.addEventListener("keydown", event => {
  if (event.isComposing || event.ctrlKey || event.altKey || event.metaKey) return;
  if (event.key === "Escape" && running && run?.status === "in_progress" && !event.repeat) {
    event.preventDefault();
    if (confirm("要提前结束任务并保存已记录的数据吗？")) {
      exitRequest = true;
      if (waiter) waiter.handler("exit", performance.now());
    }
    return;
  }
  const key = event.code === "Numpad0" || event.code === "Numpad1" ? "" : event.key;
  if (!waiter?.keys.includes(key) || event.repeat) return;
  if (event.target.matches("input,textarea,button") && key === " ") return;
  event.preventDefault();
  const clock = performance.now();
  const keyTime = event.timeStamp > 0 && event.timeStamp <= clock ? event.timeStamp : clock;
  waiter.handler(key, keyTime);
});

function showButtons(container, buttons, extraKeys = []) {
  container.replaceChildren();
  const result = press((key, time) => {
    const pending = waiter;
    waiter = null;
    pending.resolve({key, time});
  }, [...extraKeys, ...buttons.flatMap(button => button.keys || [])]);
  for (const button of buttons) {
    const el = document.createElement("button");
    el.textContent = button.label;
    el.className = button.secondary ? "secondary" : "";
    el.onclick = () => waiter?.handler(button.keys?.[0] || button.value, performance.now());
    container.append(el);
  }
  return result;
}

function stepsFor(design) {
  const steps = [];
  const add = (event, phase, block, extra = {}) => steps.push({event, phase, block, ...extra});
  add("instructions", "practice", null);
  for (let i = 0; i < 2; i++) {
    const block = i + 1;
    add("block_start", "practice", block);
    design.practice[i].forEach((pair, j) => add("choice", "practice", block, {pair, trial: j + 1}));
    design.practiceChecks[i].forEach((check, j) => add("attention", "practice", block, {check, trial: j + 1}));
    add("disturbance", "practice", block);
  }
  add("attention_result", "practice", null);
  for (let i = 0; i < 6; i++) {
    const block = i + 1;
    add("block_start", "main", block);
    design.main[i].forEach((pair, j) => add("choice", "main", block, {pair, trial: j + 1, main_trial: i * 70 + j + 1}));
    if (block === 4) {
      design.mainChecks.forEach((check, j) => add("attention", "main", block, {check, trial: j + 1}));
      add("attention_result", "main", block);
    }
    add("block_feedback", "main", block);
    add("disturbance", "main", block);
  }
  add("bonus", "main", null);
  add("comments", "main", null);
  return steps;
}

async function timedResponse(keys, maxMs, onset, fixed, accepted) {
  return new Promise(resolve => {
    let first;
    const timer = setTimeout(finish, Math.max(0, onset + maxMs - performance.now()));
    waiter = {keys, handler: (key, time) => {
      if (key === "exit") return finish();
      if (first || time < onset || time >= onset + maxMs) return;
      first = {key, time};
      accepted?.();
      if (!fixed) finish();
    }};
    function finish() {
      clearTimeout(timer);
      waiter = null;
      resolve(first || {key: null, time: null});
    }
  });
}

function measureVisibility() {
  let hidden = document.hidden || !document.hasFocus();
  const mark = () => { if (document.hidden || !document.hasFocus()) hidden = true; };
  document.addEventListener("visibilitychange", mark);
  window.addEventListener("blur", mark);
  return () => {
    document.removeEventListener("visibilitychange", mark);
    window.removeEventListener("blur", mark);
    return hidden;
  };
}

    distance, neighboring: distance === 1, response_key: key,
    chosen_image: key === "ArrowLeft" ? left : key === "ArrowRight" ? right : null,
    chosen_value: selectedRank, chosen_minus_rejected: signedDiff, correct,
    timeout: !key && !exitRequest, interrupted: exitRequest, feedback: exitRequest ? null : feedbackCode,
    rt_ms: time === null ? null : round(time - onset), fixation_frames: fixationFrames,
    fixation_onset_ms: round(performance.timeOrigin + fixOnset), stimulus_onset_ms: round(performance.timeOrigin + onset),
    stimulus_duration_ms: round(offset - onset),
    feedback_onset_ms: message && !exitRequest ? round(performance.timeOrigin + offset) : null,
    unfocused: visibility()
  };
  eventRow(result);
  if (!exitRequest) {
    await sleep(500);
    feedback.hidden = true;
    if (blank) await sleep(blank);
  }
}

function setAttentionNumbers(target, options) {
  $("target").textContent = target;
  $("up").textContent = CN_DIGITS[options[0]] + " ↑";
  $("east").textContent = CN_DIGITS[options[1]] + " →";
  $("down").textContent = CN_DIGITS[options[2]] + " ↓";
  $("west").textContent = "← " + CN_DIGITS[options[3]];
}

async function attention(step) {
  clearStage();
  const [target, options] = step.check;
  setAttentionNumbers(target, options);
  const visibility = measureVisibility();
  const onset = await frame();
  $("attention").hidden = false;
  const {key, time} = await timedResponse(DIRS, ATTENTION_RESPONSE, onset, false);
  const expected = DIRS[options.indexOf(target)];
  return {trial: step.trial, target, options_up_right_down_left: options, expected_key: expected,
    response_key: key, correct: Number(key === expected), timeout: !key && !exitRequest,
    interrupted: exitRequest, rt_ms: time === null ? null : round(time - onset),
    stimulus_onset_ms: round(performance.timeOrigin + onset), unfocused: visibility()};
}

function addDownloadButton() {
  const button = document.createElement("button");
  button.className = "secondary";
  button.textContent = "下载 JSON";
  button.onclick = downloadData;
  $("actions").append(button);
}

async function perform(step) {
  const {event, phase, block} = step;
  switch (event) {
    case "instructions": return instructions();
    case "block_start": {
      const practice = phase === "practice";
      const title = practice ? "练习 " + block + " / 2" : "正式任务 " + block + " / 6";
      const body = practice
        ? "<p>先做 8 道图片题。按 ← / → 选出价值更高的一张，拿不准也请作答。</p><p>再做 4 道数字检查题。按与中央数字对应的中文数字所在方向的键。</p>"
        : "<p>本组有 70 道图片题。按 ← / → 选出价值更高的一张，尽量又快又准。如果看到空白，等下一题即可。</p>";
      const start = showPrompt("<h1>" + title + "</h1>" + body + pauseHint, nextButton("开始"));
      if (!storageOK) addDownloadButton();
      await start;
      return {};
    }
    case "attention": return attention(step);
    case "attention_result": {
      const correct = run.rows.filter(row => row.event === "attention" && row.phase === phase && row.correct === 1).length;
      const passed = correct >= 4;
      const html = passed
        ? '<h1>数字检查已通过</h1><p>' + (phase === "practice" ? "正式任务将使用一组新图片。" : "请继续查看本组表现。") + '</p>'
        : '<h1>任务提前结束</h1><p>本次数字检查未通过。请选择「继续」，前往结果页。</p>';
      await showPrompt(html + pauseHint, nextButton());
      return {attention_correct: correct, attention_total: 8, passed};
    }
    case "disturbance": {
      const onset = performance.now();
      const {key, time} = await showPrompt(
        '<h1>环境情况</h1><p>刚才这组任务中，你有被打断吗？</p><p>有，按 <kbd>1</kbd>。没有，按 <kbd>0</kbd>。请用主键盘上的数字键，也可以点击下方选项。</p>',
        [{label:"受到干扰（1）",keys:["1"]},{label:"没有受到干扰（0）",keys:["0"],secondary:true}]);
      return {response_key: key, disturbed: key === "1", rt_ms: round(time - onset)};
    }
    case "block_feedback": {
      const trials = run.rows.filter(row => row.event === "choice" && row.phase === phase && row.block === block);
      const accuracy = trials.filter(row => row.correct === 1).length / trials.length;
      const allTrials = run.rows.filter(row => row.event === "choice" && row.phase === phase);
      const cumulative = allTrials.filter(row => row.correct === 1).length / allTrials.length;
      const band = cumulative >= .8 ? "very_high" : cumulative >= .6 ? "high" : cumulative >= .5 ? "medium" : "low";
      const message = {very_high:"到目前为止，你的正确率很高。",high:"到目前为止，你的正确率较高。",medium:"目前表现不错，还有提高的空间。",low:"目前的正确率偏低。请继续尝试。"}[band];
      await showPrompt('<h1>第 ' + block + ' 组结束</h1><p>' + message +
        '</p>' + (block < 6 ? '<p>可以先休息一下，准备好后再继续。</p>' : "") + pauseHint, nextButton());
      return {accuracy, cumulative_accuracy: cumulative, feedback_band: band};
    }
    case "bonus": {
      const trials = run.rows.filter(row => row.event === "choice" && row.phase === "main");
      const sample = run.design.bonusTrials.map(number => trials[number - 1]);
      const correct = sample.filter(row => row.correct === 1).length;
      const eligible = correct >= 6;
      await showPrompt('<h1>奖励结果</h1><p>系统随机抽取了 10 道正式题。答对至少 6 道就达到奖励条件。</p><p>' +
        (eligible ? "你已达到奖励条件。" : "你这次未达到奖励条件。") + '</p>' + pauseHint, nextButton());
      return {sampled_main_trials: sample.map(row => row.main_trial), bonus_correct: correct, bonus_eligible: eligible};
    }
    case "comments": {
      setPanel('<h1>任务反馈</h1><form id="comments-form"><label for="comments">欢迎留下意见（选填）。</label><textarea id="comments" maxlength="2000" placeholder="请勿填写姓名或联系方式。"></textarea><button>完成任务</button></form>');
      return new Promise(resolve => {
        waiter = {keys: [], handler: () => { waiter = null; resolve({}); }};
        $("comments-form").onsubmit = event => {
          event.preventDefault();
          if (!waiter) return;
          waiter = null;
          resolve({comments: $("comments").value.trim()});
        };
      });
    }
  }
}

async function runTask() {
  if (running) return;
  running = true;
  exitRequest = false;
  const lastPracticeResponse = run.rows.findLast(row => row.event === "choice" && row.phase === "practice" && row.response_key);
  practiceBlank = lastPracticeResponse?.neighboring ? 500 : 0;
  try {
    const steps = stepsFor(run.design);
    while (run.cursor < steps.length) {
      const step = steps[run.cursor];
      if (step.event === "choice") {
        await choice(step);
        abortIfRequested();
        if (step.phase === "main" && step.trial % 10 === 0) uploadSnapshot();
        continue;
      }
      const result = await perform(step);
      if (exitRequest && step.event === "attention") eventRow({event: step.event, phase: step.phase, block: step.block, ...result});
      abortIfRequested();
      eventRow({event: step.event, phase: step.phase, block: step.block, ...result});
      if (step.event === "attention_result" && !result.passed) {
        await finish("attention_failed");
        return;
      }
      if (step.event === "disturbance") uploadSnapshot();
    }
    await finish("completed");
  } catch (error) {
    if (exitRequest) {
      await finish("withdrawn");
    } else {
      console.error(error);
      setPanel('<h1>任务暂时中断</h1><p>你可以下载已记录的数据，或重新打开页面后继续。</p><div id="actions"></div>');
      addDownloadButton();
    }
  } finally {
    running = false;
  }
}

function binomialTail(correct, total) {
  let term = 2 ** -total, probability = 0;
  for (let count = 0; count <= total; count++) {
    if (count >= correct) probability += term;
    term *= (total - count) / (count + 1);
  }
  return Math.min(1, probability);
}

async function finish(status) {
  run.status = status;
  run.ended_at = timestamp();
  if (status === "completed") {
    const finalTrials = run.rows.filter(row => row.event === "choice" && row.phase === "main" && row.block >= 5);
    const answered = finalTrials.filter(row => !row.timeout && !row.interrupted);
    const correct = answered.filter(row => row.correct === 1).length;
    const accuracy = answered.length ? correct / answered.length : null;
    const p = answered.length ? binomialTail(correct, answered.length) : null;
    run.summary = {final_two_blocks_answered: answered.length, final_two_blocks_correct: correct,
      final_two_blocks_accuracy: accuracy, final_two_blocks_binomial_p: p,
      meets_learning_threshold: accuracy !== null && accuracy >= .6, passes_binomial_threshold: p !== null && p < .01};
  }
  save();
  await results();
}

async function results() {
  const completed = run.status === "completed";
  setPanel('<h1>' + (completed ? '任务已完成' : '任务已结束') + '</h1><p>感谢参与。</p>' +
    '<p id="save-status" role="status"></p><div id="actions"></div>');
  addDownloadButton();
  const status = $("save-status");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (!collection) {
    status.textContent = "请下载数据文件并交给实验组织者。";
    return;
  }
  const retry = document.createElement("button");
  retry.textContent = "重新提交";
  retry.className = "secondary";
  retry.hidden = true;
  $("actions").append(retry);
  retry.onclick = submit;
  await submit();
  async function submit() {
    retry.hidden = true;
    status.textContent = "正在提交作答。你也可以下载数据文件。";
    const revision = run.rows.length * 2 + 1;
    const ok = lastUploaded >= revision || await uploadSnapshot();
    status.textContent = ok ? "数据已提交。" : "暂未收到提交确认。你可以重新提交，或下载 JSON 文件交给实验组织者。";
    retry.hidden = ok;
  }
}

async function home() {
  setPanel('<h1>图片比较任务</h1><p>正在加载图片，请稍候。</p>');
  try {
    await preload();
  } catch {
    setPanel('<h1>图片加载失败</h1><p>请重新打开此文件或刷新页面。</p>');
    return;
  }
  const saved = readSaved();
  if (saved?.status === "in_progress" && !saved.stimulus_set &&
      saved.design.mainRanks.includes("gloves") &&
      saved.rows.some(row => row.phase === "main" && row.event === "block_start")) {
    run = saved;
    const start = showPrompt('<h1>保存先前的任务</h1><p>本任务的图片已更新。请先下载先前的记录，再开始新任务。</p>',
      [{label:"开始新任务",value:"new"}]);
    addDownloadButton();
    await start;
  } else if (saved?.status === "in_progress") {
    const {key} = await showPrompt('<h1>继续任务</h1><p>此浏览器中有一份尚未完成的记录。</p>',
      [{label:"继续任务",keys:[" "]},{label:"开始新任务",value:"new",secondary:true}]);
    if (key !== "new") {
      run = saved;
      if (!run.stimulus_set) {
        run.stimulus_set = STIMULUS_SET;
        save();
      }
      if (run.rows.at(-1)?.event === "attention_result" && run.rows.at(-1).passed === false) {
        await finish("attention_failed");
        return;
      }
      await runTask();
      return;
    }
  } else if (saved) {
    const {key} = await showPrompt('<h1>图片比较任务</h1><p>此浏览器中有一份已结束的记录。</p>',
      [{label:"查看已保存的数据",keys:[" "]},{label:"开始新任务",value:"new",secondary:true}]);
    if (key !== "new") {
      run = saved;
      await results();
      return;
    }
  }
  setPanel('<h1>图片比较任务</h1><p>请使用带实体键盘的电脑，在安静环境中完成。按 <kbd>Esc</kbd> 可提前结束。</p><p>如果页面退出全屏，可按 <kbd>F11</kbd> 尝试重新进入全屏。</p>' +
    (collection ? '<p>作答会自动提交。如果提交失败，你可以下载数据文件。</p>' : '<p>作答会保存在这个浏览器里。结束后请下载数据文件。</p>') +
    '<form id="start"><label for="code">参与者编号（选填）</label><input id="code" type="text" maxlength="60" autocomplete="off" placeholder="请勿填写姓名或联系方式。">' +
    '<fieldset><label><input type="checkbox" required> 我已了解任务和数据记录方式，自愿参加。</label></fieldset><button>阅读说明</button></form>');
  $("start").onsubmit = async event => {
    event.preventDefault();
    if (starting) return;
    starting = true;
    run = makeRun($("code").value.trim());
    lastUploaded = -1;
    save();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    await runTask();
  };
}

home();
</script>
</body>
</html>
